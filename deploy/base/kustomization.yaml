# Kubernetes base (Kustomize). backup.sh is shared with docker compose.
# Don't apply this directly: use an overlay, e.g. deploy/overlays/example.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: { app.kubernetes.io/part-of: app }
resources:
  - db.yaml
  - api.yaml
  - web.yaml
  - backup.yaml
  - ingress.yaml
configMapGenerator:
  - name: backup-script
    files: [backup.sh]
# Images are set per overlay (see overlays/example).
