apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app.kubernetes.io/name: api }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # Keep 1 replica: migrations run on startup and auth rate limiting is in-memory.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: api }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000 }
      containers:
        - name: api
          image: app-api
          envFrom: [{ secretRef: { name: app-env } }]
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: app-env, key: POSTGRES_PASSWORD } }
            # Password must be URL-safe (e.g. openssl rand -hex 16).
            - { name: DATABASE_URL, value: "postgres://app:$(POSTGRES_PASSWORD)@db:5432/app" }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
