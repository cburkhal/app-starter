name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Contract is up to date
        run: pnpm contract && git diff --exit-code packages/contract
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @app/web exec playwright install --with-deps chromium
      - name: Start stack
        run: |
          (cd apps/api && npx tsx src/index.ts > /tmp/api.log 2>&1 &)
          (cd apps/web && npx vite --port 5173 > /tmp/web.log 2>&1 &)
          npx --yes wait-on -t 60000 http://localhost:5173/api/health
      - run: pnpm --filter @app/web e2e
      - if: failure()
        run: cat /tmp/api.log /tmp/web.log

  k8s:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: helm/kind-action@v1
      - name: Validate manifests against a real API server
        run: |
          cp deploy/overlays/example/secret.env.example deploy/overlays/example/secret.env
          kubectl kustomize deploy/overlays/example > /tmp/manifests.yaml
          kubectl create namespace app
          kubectl apply --dry-run=server -f /tmp/manifests.yaml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
